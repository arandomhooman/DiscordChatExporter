name: docker

on:
  workflow_dispatch:
  push:
    branches:
      - prime
    tags:
      - "*"
  pull_request:
    branches:
      - prime

jobs:
  # Outputs from this job aren't really used, but it's here to verify that the Dockerfile builds correctly
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image
        run: >
          docker buildx build .
          --file DiscordChatExporter.Cli.dockerfile
          --platform linux/amd64,linux/arm64
          --build-arg VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('999.9.9-ci-{0}', github.sha) }}
          --output type=tar,dest=DiscordChatExporter.Cli.Docker.tar

      - name: Upload image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DiscordChatExporter.Cli.Docker
          path: DiscordChatExporter.Cli.Docker.tar
          if-no-files-found: error

  deploy:
    # Deploy to DockerHub only on tag push or prime branch push
    if: ${{ github.ref_type == 'tag' || github.ref_type == 'branch' && github.ref_name == 'prime' }}

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    # Docker publishing is opt-in for a fork: it runs only when BOTH secrets are configured, and it
    # pushes to the fork owner's own namespace — never to the upstream tyrrrz/ namespace.
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to DockerHub
        if: ${{ env.DOCKER_TOKEN != '' && env.DOCKER_USERNAME != '' }}
        run: echo "$DOCKER_TOKEN" | docker login --username "$DOCKER_USERNAME" --password-stdin

      - name: Build & push image
        if: ${{ env.DOCKER_TOKEN != '' && env.DOCKER_USERNAME != '' }}
        run: >
          docker buildx build .
          --file DiscordChatExporter.Cli.dockerfile
          --platform linux/amd64,linux/arm64
          --build-arg VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('999.9.9-ci-{0}', github.sha) }}
          --push
          --tag $DOCKER_USERNAME/discordchatexporter:latest
          ${{ github.ref_type == 'tag' && '--tag $DOCKER_USERNAME/discordchatexporter:$GITHUB_REF_NAME' || '' }}
          ${{ github.ref_type == 'tag' && '--tag $DOCKER_USERNAME/discordchatexporter:stable' || '' }}
